
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Music Player</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="player">
    <header class="topbar">
      <div class="brand"><span class="brand-icon">♫</span> Wave</div>
      <span class="status">MUSIC PLAYER</span>
    </header>

    <section class="now-playing">
      <div class="album-art" id="albumArt">
        <div class="vinyl"></div>
        <div class="art-note">♫</div>
      </div>

      <p class="eyebrow">NOW PLAYING</p>
      <h1 id="songTitle">Summer Vibes</h1>
      <p class="artist" id="artistName">Wave Collection</p>

      <audio id="audio"></audio>

      <div class="progress-area">
        <input id="progress" type="range" min="0" max="100" value="0"
               aria-label="Song progress">
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="shuffleBtn" class="small-control" title="Shuffle" aria-label="Shuffle">⤨</button>
        <button id="prevBtn" class="control" title="Previous song" aria-label="Previous song">|◀</button>
        <button id="playBtn" class="play-button" title="Play" aria-label="Play">▶</button>
        <button id="nextBtn" class="control" title="Next song" aria-label="Next song">▶|</button>
        <button id="repeatBtn" class="small-control" title="Repeat" aria-label="Repeat">↻</button>
      </div>

      <div class="volume-area">
        <span>🔈</span>
        <input id="volume" type="range" min="0" max="1" step="0.01"
               value="0.7" aria-label="Volume">
        <span>🔊</span>
      </div>
      <p id="message" class="message" aria-live="polite">Choose a song to start listening.</p>
    </section>

    <section class="playlist-section">
      <div class="section-heading">
        <div>
          <h2>Your Playlist</h2>
          <p>Pick your next favourite</p>
        </div>
        <span id="trackCount" class="track-count">3 TRACKS</span>
      </div>
      <div id="playlist" class="playlist"></div>
    </section>

    <footer>Made with ♡ using HTML, CSS & JavaScript</footer>
  </main>
</body>
</html>
